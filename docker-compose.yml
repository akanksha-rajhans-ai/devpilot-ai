services:
  api:
    build:
      context: ./backend
    container_name: devpilot-ai-api
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "DevPilot AI"
      APP_VERSION: "0.1.0"
      ENVIRONMENT: "local"
      API_V1_PREFIX: "/api/v1"
      LOG_LEVEL: "INFO"
      LLM_PROVIDER: "mock"
      OPENAI_API_KEY: ""
      OPENAI_MODEL: "gpt-4.1-mini"
      DATABASE_URL: "sqlite:///./devpilot.db"
      REDIS_URL: "redis://localhost:6379/0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 3